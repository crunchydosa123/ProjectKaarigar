worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile        on;
  keepalive_timeout  65;

  server {
    listen 8080;

    # Proxy for backend API
    location /api/ {
      proxy_pass https://backend-557742533869.asia-south1.run.app;
      proxy_set_header Host backend-557742533869.asia-south1.run.app;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Important for cookies and sessions
      proxy_cookie_domain backend-557742533869.asia-south1.run.app $host;
    }

    # Serve frontend
    location / {
      proxy_pass https://frontend-557742533869.asia-south1.run.app;
      proxy_set_header Host frontend-557742533869.asia-south1.run.app;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
